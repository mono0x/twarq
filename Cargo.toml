[package]
name = "twarq"
version = "0.20260920.22"
edition = "2024"

[lints.rust]
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
dbg_macro = "deny"
format_push_string = "warn"
needless_pass_by_value = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
strip = "symbols"

# Default builds statically link a bundled DuckDB (single-binary distribution).
# Without default features, libduckdb-sys links a prebuilt libduckdb instead;
# CI tests use this with DUCKDB_DOWNLOAD_LIB=1 to skip the C++ build.
[features]
default = ["bundled"]
bundled = ["duckdb/bundled", "duckdb/json"]

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
duckdb = { version = "1.10505.0" }
rmcp = { version = "3.1.3", features = ["transport-io", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["net", "rt", "rt-multi-thread"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
rmcp = { version = "3.1.3", features = ["client"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["io-util"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
