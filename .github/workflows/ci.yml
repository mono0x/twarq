name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
      - run: |
          rustup component add rustfmt
      - run: |
          hk check --all

  test:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MISE_DISABLE_TOOLS: hk
      # Link the prebuilt libduckdb instead of compiling bundled DuckDB.
      # Release builds still use the default bundled feature.
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
      - name: Set up Rust toolchain
        run: |
          rustup target add ${{ matrix.target }}
          rustup component add clippy
      - run: |
          cargo clippy --all-targets --no-default-features --target ${{ matrix.target }} -- -D warnings
      - run: |
          cargo test --no-default-features --target ${{ matrix.target }}
