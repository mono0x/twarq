name: Publish
on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check published release
        id: release
        run: |
          draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release.outputs.draft != 'false'
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Verify release checksums
        if: steps.release.outputs.draft != 'false'
        working-directory: release
        run: sha256sum --check checksums.txt
      - name: Create draft release
        if: steps.release.outputs.draft == ''
        run: gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
      - name: Upload release artifacts
        if: steps.release.outputs.draft != 'false'
        run: gh release upload "$RELEASE_TAG" release/* --clobber
      - name: Publish release
        if: steps.release.outputs.draft != 'false'
        run: gh release edit "$RELEASE_TAG" --draft=false
