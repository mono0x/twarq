name: Release
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    timeout-minutes: 120
    if: github.ref == 'refs/heads/main'
    # The Apple SDK is needed to cross-compile the macOS targets.
    runs-on: macos-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      MISE_DISABLE_TOOLS: hk
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.10.17
      - name: Prepare release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prepare_release.py
      - name: Build draft release
        if: steps.prepare.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_BUILD_JOBS: "3"
        run: goreleaser release --clean --parallelism 1
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.prepare.outputs.published != 'true'
        with:
          subject-checksums: dist/checksums.txt
      - name: Publish release
        if: steps.prepare.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
