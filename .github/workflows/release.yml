name: Release
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    env:
      MISE_DISABLE_TOOLS: hk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.10.17
          cache: false
      - name: Prepare release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '.created_at | fromdateiso8601 + 32400 | strftime("%Y%m%d")')
          version="0.$date.$GITHUB_RUN_NUMBER"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^")" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$tag" origin/main
            exit 0
          fi
          if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
            echo 'main has advanced; start a new release workflow' >&2
            exit 1
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0].conclusion')
          if test "$conclusion" != success; then
            echo 'The latest push CI run for this commit must succeed first' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          cargo release "$version" --execute --no-confirm
          echo 'push=true' >> "$GITHUB_OUTPUT"
      - name: Create release App token
        if: steps.prepare.outputs.push == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push release
        if: steps.prepare.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
