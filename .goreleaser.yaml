version: 2
project_name: twarq

release:
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true

builds:
  - builder: rust
    targets:
      - x86_64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin
    flags:
      - --release
      - --locked

changelog:
  use: github-native

checksum:
  name_template: checksums.txt
